<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090B10" />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('vaultx_theme');
          var isDark = savedTheme ? savedTheme === 'dark' : true;
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          var savedColor = localStorage.getItem('vaultx_theme_color');
          var themeColor = savedColor || (isDark ? '#090B10' : '#F8FAFC');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', themeColor);
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vaultx" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Vaultx — Crypto Wallet & Portfolio</title>
    <meta name="description" content="Mobile crypto portfolio & wallet simulator with customizable balances, tokens, charts, and transaction history." />
    <meta property="og:title" content="Vaultx — Crypto Wallet & Portfolio" />
    <meta property="og:description" content="Mobile crypto portfolio & wallet simulator with customizable balances, tokens, charts, and transaction history." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 dark:bg-[#090B10] text-slate-900 dark:text-slate-50 antialiased selection:bg-blue-500/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
